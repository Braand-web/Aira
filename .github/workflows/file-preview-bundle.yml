name: File preview bundle guard

on:
  pull_request:
    paths:
      - "app/layout.tsx"
      - "components/file-preview/**"
      - "app/api/files/**"
      - "app/studio.tsx"
      - "lib/file-upload.mjs"
      - "lib/file-policy.mjs"
      - "lib/file-retention.ts"
      - "drizzle/0006_file_upload_sessions.sql"
      - "drizzle/0007_file_upload_byte_limits.sql"
      - "package.json"
      - "package-lock.json"
      - "tests/file-preview-bundle.test.mjs"
      - "tests/file-upload.test.mjs"
      - "tests/file-preview.integration.mjs"
      - "tests/run-file-upload-integration.mjs"
      - ".github/workflows/file-preview-bundle.yml"
  push:
    paths:
      - "app/layout.tsx"
      - "components/file-preview/**"
      - "app/api/files/**"
      - "app/studio.tsx"
      - "lib/file-upload.mjs"
      - "lib/file-policy.mjs"
      - "lib/file-retention.ts"
      - "drizzle/0006_file_upload_sessions.sql"
      - "drizzle/0007_file_upload_byte_limits.sql"
      - "package.json"
      - "package-lock.json"
      - "tests/file-preview-bundle.test.mjs"
      - "tests/file-upload.test.mjs"
      - "tests/file-preview.integration.mjs"
      - "tests/run-file-upload-integration.mjs"
      - ".github/workflows/file-preview-bundle.yml"

jobs:
  pdf-reader-lazy-chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npm run test:file-upload-integration
      - run: npm run test:file-preview-bundle
