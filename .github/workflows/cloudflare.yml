name: Prepare private Cloudflare staging
on:
  workflow_dispatch:
    inputs:
      migrate_staging:
        description: Apply reviewed SQL migrations to the isolated staging database
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: braand-cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BRAAND_STAGING_D1_ID: ${{ vars.BRAAND_STAGING_D1_ID }}
      BRAAND_STAGING_FILES_BUCKET: ${{ vars.BRAAND_STAGING_FILES_BUCKET }}
      BRAAND_STAGING_BACKUPS_BUCKET: ${{ vars.BRAAND_STAGING_BACKUPS_BUCKET }}
      BRAAND_PRODUCTION_D1_ID: ${{ vars.BRAAND_PRODUCTION_D1_ID }}
      BRAAND_PRODUCTION_FILES_BUCKET: ${{ vars.BRAAND_PRODUCTION_FILES_BUCKET }}
      BRAAND_PRODUCTION_BACKUPS_BUCKET: ${{ vars.BRAAND_PRODUCTION_BACKUPS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run cloudflare:config -- staging
      - name: Apply explicitly requested staging migrations
        if: inputs.migrate_staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config .wrangler/deploy/staging.json
      - name: Deploy private staging (no routes or public URL)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler deploy --config .wrangler/deploy/staging.json
