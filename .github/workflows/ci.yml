name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Check all TypeScript
        run: npm run typecheck
      - name: Lint all source and tests
        run: npm run lint
      - name: Build production Worker and browser assets
        run: npm run build
      - name: Run unit, service, browser bundle, file and HTTP tests offline
        run: npm test
      - name: Prepare isolated browser checks on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/braand-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/braand-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop and mobile interactions without providers
        env:
          BRAAND_PLAYWRIGHT_MODULE: ${{ runner.temp }}/braand-browser/node_modules/playwright/index.mjs
        run: |
          node tests/agent-ui.browser.mjs
          node tests/auth-ui.browser.mjs
      - name: Keep fixture screenshots online
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: |
            .tmp/agent-ui-browser/*.png
            .tmp/auth-ui/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the verified production build
        if: github.ref == 'refs/heads/feat/global-workflow'
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
      - name: Deploy the reviewed chat and billing correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/chat-routing-credit-settlement'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_DEPLOY_ONCE }}
          CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Build and tests completed. Deployment awaits the temporary Cloudflare credential."
            exit 0
          fi
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified chat and billing fix ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          curl --fail --silent --show-error "https://braand.fun/api/health?check=assistant"
