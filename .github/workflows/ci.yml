name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Check all TypeScript
        run: npm run typecheck
      - name: Lint all source and tests
        run: npm run lint
      - name: Build production Worker and browser assets
        run: npm run build
      - name: Run unit, service, browser bundle, file and HTTP tests offline
        run: npm test
      - name: Prepare isolated browser checks on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/braand-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/braand-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop and mobile interactions without providers
        env:
          BRAAND_PLAYWRIGHT_MODULE: ${{ runner.temp }}/braand-browser/node_modules/playwright/index.mjs
        run: node tests/agent-ui.browser.mjs
      - name: Keep fixture screenshots online
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: .tmp/agent-ui-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
