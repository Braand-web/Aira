    <text x="600" y="254" text-anchor="middle" font-size="77" font-weight="600" letter-spacing="-4">Les matins ont du goût.</text>
    <text x="600" y="310" text-anchor="middle" font-size="25">Le café. Le calme. Votre moment.</text>
